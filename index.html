<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BadBoy Kick</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/attiakhaled663-cloud/BadBoy-KickRoro/refs/heads/main/RedKick_files/ab46995c-be54-4f0c-97d9-dc9965e3150b.png">
<style>
    html, body { margin:0; height:100%; background:#0a0f08; color:#5a7a5a; font-family:'Tajawal',sans-serif; }
    #boot { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:20px; box-sizing:border-box; }
    #boot .sp { width:34px; height:34px; border:3px solid rgba(83,252,24,.25); border-top-color:#53fc18; border-radius:50%; animation:s .8s linear infinite; }
    #boot button { background:#53fc18; color:#000; border:0; border-radius:10px; padding:10px 18px; font-weight:800; font-family:inherit; font-size:13px; cursor:pointer; }
    @keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="boot"><div class="sp"></div><div>جارٍ التحميل...</div></div>

<script>
var CORE_URL = 'https://raw.githubusercontent.com/khaledx12/BadBoyKick/refs/heads/main/core.html';

async function loadCore() {
    var boot = document.getElementById('boot');
    if (boot) boot.innerHTML = '<div class="sp"></div><div>جارٍ التحميل...</div>';
    try {
        var res = await fetch(CORE_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var html = await res.text();
        if (!html || html.indexOf('</html>') === -1) throw new Error('empty');
        document.open();
        document.write(html);
        document.close();
    } catch (e) {
        if (boot) boot.innerHTML = '<div style="color:#ff3b3b;font-size:15px">تعذّر تحميل التطبيق</div>'
            + '<button onclick="loadCore()">إعادة المحاولة</button>';
    }
}
loadCore();
</script>
</body>
</html>
